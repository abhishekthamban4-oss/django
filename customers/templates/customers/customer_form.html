<!DOCTYPE html>
<html>
<head>
    <title>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Customer</title>
</head>
<body>
    <h1>{% if form.instance.pk %}Edit{% else %}Add New{% endif %} Customer</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <a href="{% url 'customer-list' %}">Cancel</a>
</body>
</html>
